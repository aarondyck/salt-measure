<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img"><title>Wiring between the ultrasonic sensor and the ESP32-C3</title><desc>VCC to 5V, Trig straight to GPIO0, Echo through a 1k resistor to a junction that goes to GPIO1 and through a 2.2k resistor to ground, GND to GND.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#2C2C2A}.ts{font-size:12px}.th{font-size:14px;font-weight:bold}</style><rect width="680" height="380" fill="#fff"/>
<rect x="40" y="50" width="110" height="290" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text class="th" x="95" y="34" text-anchor="middle">Ultrasonic sensor</text>
<rect x="530" y="50" width="110" height="290" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/><text class="th" x="585" y="34" text-anchor="middle">ESP32-C3</text>
<text class="ts" x="138" y="85" text-anchor="end" dominant-baseline="central">VCC</text><text class="ts" x="138" y="140" text-anchor="end" dominant-baseline="central">Trig</text><text class="ts" x="138" y="200" text-anchor="end" dominant-baseline="central">Echo</text><text class="ts" x="138" y="310" text-anchor="end" dominant-baseline="central">GND</text>
<text class="ts" x="542" y="85" dominant-baseline="central">5V</text><text class="ts" x="542" y="140" dominant-baseline="central">GPIO0</text><text class="ts" x="542" y="200" dominant-baseline="central">GPIO1</text><text class="ts" x="542" y="310" dominant-baseline="central">GND</text>
<line x1="150" y1="85" x2="530" y2="85" stroke="#E24B4A" stroke-width="2"/><line x1="150" y1="140" x2="530" y2="140" stroke="#1D9E75" stroke-width="2"/>
<line x1="150" y1="200" x2="240" y2="200" stroke="#BA7517" stroke-width="2"/><line x1="330" y1="200" x2="530" y2="200" stroke="#BA7517" stroke-width="2"/>
<line x1="420" y1="200" x2="420" y2="222" stroke="#BA7517" stroke-width="2"/><line x1="420" y1="262" x2="420" y2="310" stroke="#BA7517" stroke-width="2"/><line x1="150" y1="310" x2="530" y2="310" stroke="#888780" stroke-width="2"/>
<rect x="240" y="188" width="90" height="24" rx="4" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><text class="th" x="285" y="200" text-anchor="middle" dominant-baseline="central" style="fill:#412402">1 kΩ</text>
<rect x="406" y="222" width="28" height="40" rx="4" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/><text class="th" x="446" y="242" dominant-baseline="central">2.2 kΩ</text>
<circle cx="420" cy="200" r="4" fill="#BA7517"/><circle cx="420" cy="310" r="4" fill="#888780"/>
<text class="ts" x="340" y="73" text-anchor="middle">5 V power</text><text class="ts" x="340" y="128" text-anchor="middle">3.3 V trigger signal</text><text class="ts" x="195" y="188" text-anchor="middle">5 V</text><text class="ts" x="475" y="188" text-anchor="middle">about 3.4 V</text><text class="ts" x="340" y="298" text-anchor="middle">Ground</text><text class="ts" x="420" y="332" text-anchor="middle">Junction</text></svg>