<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img"><title>Mini breadboard layout for the salt sensor</title><desc>17-row mini breadboard with the ESP32-C3 in rows 1 to 8, sensor pins in A13 to A16, 1k resistor E15 to F15, 2.2k resistor H15 to I16, and jumper wires for 5V, trigger, echo and ground.</desc><style>text{font-family:Helvetica,Arial,sans-serif;fill:#2C2C2A}.ts{font-size:12px}.th{font-size:14px;font-weight:bold}</style><rect width="680" height="520" fill="#fff"/>
