esphome:
  name: salt-level-sensor
  
esp32: 
  board: esp32-c3-devkitm-1 
  framework:
    type: esp-idf

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret salt_level_sensor__encryption_key

# Enable over-the-air updates.
ota:
  platform: esphome
  encryption:

# Enable Web server.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  output_power: 11dB
  min_auth_mode: WPA2

# Sync time with Home Assistant.
time:
  - platform: homeassistant
    id: homeassistant_time

# Text sensors with general information.
button:
  - platform: restart
    name: "Restart Device"
    id: restart_device_button
  - platform: template
    name: "Salt Level Manual Update"
    id: salt_level_manual_trigger
    on_press:
      - component.update: raw_distance_m
      - component.update: clamped_distance_m

sensor:
  - platform: uptime
    name: salt_level_sensor Uptime
  - platform: wifi_signal
    name: salt_level_sensor WiFi Signal
    update_interval: 60s
    
  # 🛑 1. PHYSICAL SENSOR: Raw Distance
  # (MITIGATION 1: Removed internal: true and added diagnostic category for visibility)
  - platform: ultrasonic
    trigger_pin: GPIO0 
    echo_pin: GPIO1
    name: "Salt Tank Distance Raw" 
    id: raw_distance_m
    update_interval: 30s
    entity_category: "diagnostic"
    unit_of_measurement: "m"
    # (MITIGATION 2: Filter out NaN to prevent breaking dependent math)
    filters:
      - filter_out: NAN
    on_value:
      then:
        - component.update: clamped_distance_m
        - component.update: salt_level_percent
        - component.update: salt_level_cm

  # 🛑 4. TEMPLATE SENSOR: Salt Tank Distance Clamped 
  - platform: template
    name: "Salt Tank Distance Clamped"
    id: clamped_distance_m
    unit_of_measurement: "m"
    update_interval: never
    lambda: 'return id(raw_distance_m).state;'
    filters:
      - clamp:
          # Observed history: full tank ~0.17 m, salt below water line at ~0.85 m
          min_value: 0.17
          max_value: 0.85

  # 🛑 2. TEMPLATE SENSOR: Salt Level in Percent (%)
  - platform: template
    name: "Saltlevel in percent"
    id: salt_level_percent
    unit_of_measurement: "%"
    update_interval: never
    lambda: 'return (0.85 - id(clamped_distance_m).state) * (100.0 / 0.68);'
    filters:
      - clamp:
          min_value: 0.0
          max_value: 100.0
      - sliding_window_moving_average:
          window_size: 32
          send_every: 1
    # (MITIGATION 3: Watchdog trigger - Reboots if value is bad for 15 minutes)
    on_value:
      then:
        - if:
            condition:
              lambda: 'return std::isnan(x);'
            then:
              - wait_until:
                  condition:
                    lambda: 'return !std::isnan(id(salt_level_percent).state);'
                  timeout: 15min
              - if:
                  condition:
                    lambda: 'return std::isnan(id(salt_level_percent).state);'
                  then:
                    - logger.log: "Watchdog: Sensor stuck on NaN. Rebooting..."
                    - button.press: restart_device_button
          
  # 🛑 3. TEMPLATE SENSOR: Salt Level in CM (cm)
  - platform: template
    name: "Saltlevel in cm"
    id: salt_level_cm
    unit_of_measurement: "cm"
    update_interval: never
    lambda: 'return (0.85 - id(clamped_distance_m).state) * 100.0;'

  # 🛑 5. TREND SENSOR: Salt Level 12h Average (%)
  - platform: template
    name: "Salt Level 12h Average"
    unit_of_measurement: "%"
    lambda: 'return id(salt_level_percent).state;'
    update_interval: 60s 
    filters:
      - throttle: 15min 
      - sliding_window_moving_average:
          window_size: 48 
          send_every: 1